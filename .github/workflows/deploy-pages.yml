name: Deploy GitHub Pages

on:
  push:
    branches: [fpa-dashboard, pre-prod]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production (fpa-dashboard)
        uses: actions/checkout@v4
        with:
          ref: fpa-dashboard
          path: prod

      - name: Checkout preview (pre-prod)
        uses: actions/checkout@v4
        with:
          ref: pre-prod
          path: preview
        continue-on-error: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build production
        working-directory: prod
        env:
          PAGES_BASE: /dashboard/
        run: |
          npm ci
          npm run build

      - name: Build preview
        if: hashFiles('preview/package.json') != ''
        working-directory: preview
        env:
          PAGES_BASE: /dashboard/preview/
        run: |
          npm ci
          npm run build

      - name: Assemble site
        run: |
          mkdir -p site
          cp -r prod/dist/. site/
          if [ -d preview/dist ]; then
            mkdir -p site/preview
            cp -r preview/dist/. site/preview/
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
